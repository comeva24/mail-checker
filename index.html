<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>メール物件チェッカー</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50">

<div class="max-w-2xl mx-auto px-6 py-16">

  <header class="mb-10">
    <div style="display:flex;align-items:center;gap:6px;height:30px;padding:0;margin-bottom:16px;background:#fff">
      <img src="brand/symbol-64.png" alt="" width="27" height="22">
      <img src="brand/wordmark.png" alt="RaytAsu" width="88" height="19">
    </div>
    <h1 class="text-3xl font-bold text-slate-900">メール物件チェッカー</h1>
    <p class="mt-3 text-slate-600">
      不動産投資家が自分あてに届く物件資料メールを、毎朝自動でチェックするための個人用ツールです。
    </p>
  </header>

  <section class="bg-white rounded-xl p-6 shadow-sm mb-6">
    <h2 class="text-lg font-bold text-slate-900 mb-3">できること</h2>
    <ul class="space-y-2 text-slate-700 list-disc list-inside">
      <li>不動産業者から届いたメールの添付資料（PDF・画像）を読み取る</li>
      <li>価格・利回り・築年数などから、あらかじめ決めた投資基準を満たすか判定する</li>
      <li>基準を満たす物件があれば、利用者本人のLINEに通知する</li>
    </ul>
  </section>

  <section class="bg-white rounded-xl p-6 shadow-sm mb-6">
    <h2 class="text-lg font-bold text-slate-900 mb-3">利用者について</h2>
    <p class="text-slate-700">
      このツールは開発者本人が自分のメールを対象に使う個人用ツールであり、
      一般に公開・配布しているサービスではありません。
      Gmailへのアクセスは<strong>読み取り専用</strong>で、メールの送信・削除・変更は行いません。
    </p>
  </section>

  <footer class="pt-6 border-t border-slate-200">
    <a href="./privacy.html" class="text-blue-700 underline">プライバシーポリシー</a>
  </footer>

</div>

</body>
</html>
